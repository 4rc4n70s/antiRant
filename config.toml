# antiRant config
# La API key NO va acá: se lee de $GEMINI_API_KEY o de ~/.config/antirant/gemini_key

[gemini]
model = "gemini-3.8-flash"
# low = más rápido; medium/high entiende mejor dictados largos y caóticos pero tarda más
thinking_level = "low"
temperature = 0.2
# Debe ser menor que post_process_timeout_ms del perfil de voxtype (6000)
timeout_secs = 4.5

[safety]
# Si la salida supera len(original) * max_growth + 40 caracteres, se descarta
# y se escribe la transcripción original.
max_growth = 1.3

[log]
# Guarda entrada/salida en ~/.local/state/antirant/log.jsonl (local) para
# poder afinar el prompt. Desactivalo si no querés historial de lo dictado.
enabled = true
